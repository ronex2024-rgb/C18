<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#f59e0b" stroke-width="12" />
  <circle cx="256" cy="256" r="170" fill="#f59e0b" fill-opacity="0.12" stroke="#f59e0b" stroke-width="4" stroke-dasharray="8 6" />
  <!-- Weevil / Beetle Graphic -->
  <g transform="translate(136, 120) scale(1.0)">
    <!-- Antennae -->
    <path d="M 90 60 Q 60 10 30 20" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none" />
    <path d="M 150 60 Q 180 10 210 20" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none" />
    <circle cx="30" cy="20" r="8" fill="#f59e0b" />
    <circle cx="210" cy="20" r="8" fill="#f59e0b" />
    
    <!-- Legs -->
    <path d="M 50 110 L 10 90" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <path d="M 190 110 L 230 90" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <path d="M 45 160 L 5 165" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <path d="M 195 160 L 235 165" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <path d="M 55 210 L 15 240" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    <path d="M 185 210 L 225 240" stroke="#d97706" stroke-width="7" stroke-linecap="round" />
    
    <!-- Head -->
    <ellipse cx="120" cy="65" rx="35" ry="30" fill="#78350f" stroke="#f59e0b" stroke-width="4" />
    <circle cx="105" cy="60" r="5" fill="#fef08a" />
    <circle cx="135" cy="60" r="5" fill="#fef08a" />

    <!-- Thorax -->
    <ellipse cx="120" cy="115" rx="55" ry="40" fill="#92400e" stroke="#f59e0b" stroke-width="4" />

    <!-- Elytra (Abdomen) -->
    <path d="M 65 135 C 60 210, 75 255, 120 270 C 165 255, 180 210, 175 135 Z" fill="#b45309" stroke="#f59e0b" stroke-width="5" />
    <line x1="120" y1="135" x2="120" y2="270" stroke="#78350f" stroke-width="4" />
  </g>
  <!-- Text Label -->
  <text x="256" y="445" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#f8fafc" text-anchor="middle" letter-spacing="4">M-PAS</text>
  <text x="256" y="475" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="2">CIGARETTE BIOSECURITY</text>
</svg>
